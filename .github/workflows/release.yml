# 推送版本 tag（例如 v1.0.0）時自動發佈：
# 檢查版本（版號規則見 scripts/check-version.mjs）→ 型別檢查與測試 → 打包 .vsix → 以 CHANGELOG 對應段落建立 GitHub Release 並附上 .vsix
name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 版號規則見 scripts/check-version.mjs：只收 major.minor.patch，minor 奇數＝預發布、偶數＝正式
      - name: 檢查版號規則
        id: version
        run: node scripts/check-version.mjs

      - name: 檢查版本並取出 Release 說明
        run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" > release-notes.md

      - run: npm run typecheck
      - run: npm test
      - run: npm run package

      - name: 建立 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # minor 為奇數（例如 v1.5.0）時標為 pre-release
          flags=()
          if [[ "${{ steps.version.outputs.prerelease }}" == "true" ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" ./*.vsix \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag \
            "${flags[@]}"
