name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 版號規則（major.minor.patch；minor 奇數＝預發布）：不符合就失敗，符合時提示這個版本會以哪種類型發佈
      - run: node scripts/check-version.mjs
      - run: npm run typecheck
      - run: npm test
      # UI 端對端測試（Playwright + Chromium；webview 與 git 都是真的，VS Code API 為模擬）
      # Chromium 放在固定資料夾並依 package-lock.json（Playwright 版本）快取；Linux 另外安裝系統相依套件（無法快取）
      - uses: actions/cache@v6
        with:
          path: .playwright-browsers
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: runner.os == 'Linux'
        run: npx playwright install-deps chromium
      - run: npx playwright install chromium
      - run: npm run test:ui
      # 下載的 VS Code（每個約 350 MB）依作業系統與週次快取，同一週內不重複下載
      - id: week
        shell: bash
        run: echo "week=$(date +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: .vscode-test
          key: vscode-test-${{ runner.os }}-${{ steps.week.outputs.week }}
          restore-keys: vscode-test-${{ runner.os }}-
      # 真實 VS Code 測試（@vscode/test-electron）；Linux 沒有畫面，用 xvfb 提供虛擬顯示器
      - name: 真實 VS Code 測試
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:vscode
      - name: 真實 VS Code 測試
        if: runner.os == 'Windows'
        run: npm run test:vscode
      # 最低支援版本（package.json 的 engines.vscode）：抓出不小心用了新版才有的 API
      - name: 真實 VS Code 測試（1.90.0）
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:vscode
        env:
          VSCODE_VERSION: 1.90.0
      - run: npm run package
      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest'
        with:
          name: vsix
          path: '*.vsix'
